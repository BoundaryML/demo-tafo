[package]
name = "tafo"
version = "0.2.0"
edition = "2021"
rust-version = "1.91.1"

[features]
native-smoke = []

[dependencies]
baml_bridge = "=0.25.3-nightly.20261108.a"
baml_sdk = { path = "baml_sdk", features = ["serde"] }
libc = "=0.2.186"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
lto = "thin"
strip = true
