name: Package macOS app

on:
  workflow_dispatch:
    inputs:
      telemetry:
        description: Embed development telemetry (requires configured key)
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Apple Silicon app
    runs-on: macos-15
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
    timeout-minutes: 30
    env:
      BAML_TELEMETRY: "off"
      BOUNDARY_API_KEY: local
      SMART_SWITCH_CLOUD: ${{ (github.event_name == 'push' || inputs.telemetry == true) && '1' || '0' }}
      TAFO_CLOUD_LABEL: ${{ vars.TAFO_TELEMETRY_ENVIRONMENT }}
      TAFO_EMBED_TELEMETRY: ${{ (github.event_name == 'push' || inputs.telemetry == true) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: BoundaryML/setup-baml@v1
      - name: Test release source
        run: ./scripts/test.sh
      - name: Configure telemetry destination
        if: github.event_name == 'push' || inputs.telemetry == true
        env:
          TELEMETRY_PROJECT: ${{ vars.TAFO_TELEMETRY_PROJECT }}
          TELEMETRY_ENVIRONMENT: ${{ vars.TAFO_TELEMETRY_ENVIRONMENT }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          project = os.environ['TELEMETRY_PROJECT']
          environment = os.environ['TELEMETRY_ENVIRONMENT']
          if not project or not environment:
              raise SystemExit('Set TAFO_TELEMETRY_PROJECT and TAFO_TELEMETRY_ENVIRONMENT repository variables')
          path = Path('baml.toml')
          text = path.read_text().replace('embed_telemetry_env = "dev"', 'embed_telemetry_env = ' + json.dumps(environment))
          path.write_text(text + '\n[boundary]\nproject = ' + json.dumps(project) + '\n')
          PY
      - name: Package app and matching BAML runtime
        env:
          TAFO_TELEMETRY_KEY: ${{ secrets.TAFO_TELEMETRY_KEY }}
        run: ./scripts/package.sh
      - name: Smoke test packaged runtime without network or user state
        env:
          SMART_SWITCH_STATE_DIR: ${{ runner.temp }}/tafo-smoke
        run: |
          dist/Tafo.app/Contents/MacOS/SmartSwitch --dry-run --text Finder
          unzip -t dist/Tafo-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tafo-macos-arm64
          path: |
            dist/Tafo-macos-arm64.zip
            dist/Tafo-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tafo-macos-arm64
          path: release
      - name: Publish release preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease \
            --title "Tafo $RELEASE_TAG" \
            --notes 'Apple Silicon preview. Download the ZIP, move Tafo.app to Applications, and open it. Includes the matching BAML runtime and write-only telemetry for the production environment. Ad-hoc signed, not notarized. See README for model configuration and privacy details.'
